name: Deploy demo to GitHub Pages

# サツコイ！の静的UIデモ（読み取り専用）を GitHub Pages へ自動デプロイする。
# Settings → Pages → Source を「GitHub Actions」に設定すると有効になります。
# 公開URL: https://playmark0227-svg.github.io/satukoi/

on:
  push:
    branches:
      - main
      - claude/relaxed-hypatia-rfik5o
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: satukoi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/satukoi
      AUTH_SECRET: ci-demo-secret-not-used-in-static-export
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed demo data
        run: npm run db:seed

      - name: Build static demo (output: export)
        run: npm run demo:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
