name: Deploy demo to GitHub Pages

# サツコイ！の静的UIデモ（読み取り専用）をビルドし、gh-pages ブランチへ公開する。
# 公開には Settings → Pages → Source を「Deploy from a branch」→「gh-pages / (root)」に設定。
# 公開URL: https://playmark0227-svg.github.io/satukoi/
#
# ※ 保護された github-pages 環境を使わず gh-pages ブランチへ push する方式のため、
#   既定ブランチ以外からでもワークフロー自体は成功します。

on:
  push:
    branches:
      - main
      - claude/relaxed-hypatia-rfik5o
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: satukoi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/satukoi
      AUTH_SECRET: ci-demo-secret-not-used-in-static-export
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed demo data
        run: npm run db:seed

      - name: Build static demo (output: export)
        run: npm run demo:build

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
