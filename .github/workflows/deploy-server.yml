name: Deploy server (Cloud Run)

# 会員アプリ＋運営管理画面（/admin）を Cloud Run にデプロイする。
# GCP の設定（docs/DEPLOY.md）が済むまでは何もしない（GCP_PROJECT_ID 未設定ならスキップ）。
#
# 必要な Repository variables: GCP_PROJECT_ID / GCP_REGION / CLOUD_RUN_SERVICE /
#   NEXT_PUBLIC_APP_URL / NEXT_PUBLIC_LIFF_ID / NEXT_PUBLIC_LINE_OA_ID
# 必要な Repository secrets:   GCP_WORKLOAD_IDENTITY_PROVIDER / GCP_SERVICE_ACCOUNT
# 実行時の秘密情報（DATABASE_URL・AUTH_SECRET・LINE・Stripe）は Secret Manager に置き、
# Cloud Run のサービス側で環境変数として参照する。

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: ${{ vars.GCP_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/satukoi/app:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build & push image
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
          docker build \
            --build-arg NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }} \
            --build-arg NEXT_PUBLIC_LIFF_ID=${{ vars.NEXT_PUBLIC_LIFF_ID }} \
            --build-arg NEXT_PUBLIC_LINE_OA_ID=${{ vars.NEXT_PUBLIC_LINE_OA_ID }} \
            -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ vars.CLOUD_RUN_SERVICE }} \
            --image "$IMAGE" \
            --region ${{ vars.GCP_REGION }} \
            --allow-unauthenticated \
            --port 8080

      - name: Health check
        run: |
          URL=$(gcloud run services describe ${{ vars.CLOUD_RUN_SERVICE }} --region ${{ vars.GCP_REGION }} --format 'value(status.url)')
          curl -fsS "$URL/api/health"
